services:
  portfolio:
    build: .
    container_name: portfolio-tracker
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Host path for the SQLite DB. Override DATA_DIR in .env (e.g. on the Pi:
      # DATA_DIR=/DATA/AppData/portfolio-tracker). Defaults to ./data for local dev.
      - ${DATA_DIR:-./data}:/app/data
    environment:
      - TZ=Asia/Kolkata
      # Optional HTTP Basic Auth — set APP_PASSWORD in .env to require a login.
      # Leave unset to disable auth (default).
      - APP_USERNAME=${APP_USERNAME:-admin}
      - APP_PASSWORD=${APP_PASSWORD:-}
      # Set to 1 only when troubleshooting imports; exposes /api/debug/* routes.
      - ENABLE_DEBUG_ENDPOINTS=${ENABLE_DEBUG_ENDPOINTS:-}
      # Read-only MCP server for AI tools (Claude/ChatGPT/Gemini). Off unless ENABLE_MCP=1.
      # Set MCP_TOKEN to a long random secret and add the Pi's host to MCP_ALLOWED_HOSTS.
      # See docs/mcp.md. Mounted at http://<host>:8000/mcp on this same port.
      - ENABLE_MCP=${ENABLE_MCP:-}
      - MCP_TOKEN=${MCP_TOKEN:-}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
