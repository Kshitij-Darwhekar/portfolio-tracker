<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#161b22"/>
  <!-- Upward line chart representing portfolio growth -->
  <polyline
    points="4,24 10,18 16,20 22,10 28,6"
    fill="none"
